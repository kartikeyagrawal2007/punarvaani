# Weeks 6-7: adapt English AV-HuBERT-Large to Hindi lip reading (Path A).
# GPU: 1x A100 40GB, or a T4/P100 16GB with max_frames_per_batch ~1200 and grad_accum 4.
# python -m punarvaani.training.train_vsr --config configs/hindi_adapt.yaml
data:
  kind: manifest
  train_manifest: data/hindi_av/train.jsonl     # written by `punarvaani mine`
  val_manifest: data/hindi_av/val.jsonl
  max_frames: 375                  # drop clips > 15 s
  max_frames_per_batch: 2400       # ~96 s of video per step (dynamic batching)
  num_workers: 4
model:
  encoder_preset: large
  avhubert_checkpoint: checkpoints/avhubert/large_vox_iter5.pt   # Meta's self-supervised checkpoint
  encoder_overrides:
    mask_prob: 0.3        # time masking: regularises the small Hindi set
    mask_length: 5
    layerdrop: 0.1
  decoder_layers: 6
  ctc_weight: 0.3
  label_smoothing: 0.1
lora:
  enabled: true
  name: hindi
  r: 16
  alpha: 32
  dropout: 0.05
  targets: [q_proj, v_proj, out_proj, fc1, fc2, proj, post_extract_proj]
  train_extra: [ctc_head, decoder]   # new heads train fully
train:
  lr: 5.0e-4
  warmup_steps: 2000
  max_steps: 40000
  grad_accum: 2
  clip_norm: 5.0
  amp: auto
  log_every: 100
  eval_every: 2000
  out_dir: outputs/hindi_adapt
eval:
  max_batches: 50
